[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ytsaurus-airflow-provider"
authors = [
    { name = "YTsaurus", email = "ilyaibraev@ytsaurus.tech" },
]
license = { text = "Apache License 2.0" }
description = "YTsaurus Apache Airflow provider."
classifiers = [
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dynamic = [
    "version"
]
requires-python = ">=3.10"
dependencies = [
    "apache-airflow>=2.9.0",
    "ytsaurus-client>=0.13.23",
    "ytsaurus-yson>=0.4.3",
    "apache-airflow-providers-amazon[s3fs]>=8.19.0",
    "s3fs>=2023.10.0",
    "packaging",
]

[project.urls]
Homepage = "https://ytsaurus.tech/"
Source = "https://github.com/ytsaurus/ytsaurus-airflow-provider/"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.entry-points.apache_airflow_provider]
provider_info = "ytsaurus_airflow_provider.__init__:get_provider_info"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "ytsaurus_airflow_provider.__version__" }

[tool.setuptools.packages.find]
exclude = [
    "tests",
]

[tool.ruff]
line-length = 200
indent-width = 4
target-version = "py310"
lint.select = ["ALL"]
lint.ignore = ["AIR311", "ANN401", "COM812", "CPY001", "D100", "D101", "D102", "D103", "D104", "D107", "D203", "D211", "D213", "PGH003", "PLC0415", "PLR0913", "PLR2004", "S101", "UP007", "UP009", "UP045"]
lint.per-file-ignores = { "tests/**" = ["PLR0917"] }
exclude = ["dev/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.mypy]
disable_error_code = []
files = ["ytsaurus_airflow_provider", "tests"]

[[tool.mypy.overrides]]
module = ["yt.*", "testcontainers.core.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# flask_appbuilder/flask_babel/wtforms are only pulled in by Airflow's optional webserver/FAB
# extra and are not installed in every environment (e.g. bare `apache-airflow` without the UI).
module = ["flask_appbuilder.*", "flask_babel.*", "wtforms.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `airflow.sdk` is only available on Airflow 3.x; CI type-checks against 2.x, where the
# module genuinely does not exist, so the import is unresolvable rather than merely untyped.
module = [
    "airflow.sdk",
    "airflow.sdk.*",
    "airflow.dag_processing.dagbag",
    "airflow.models.dagbundle",
]
ignore_missing_imports = true
